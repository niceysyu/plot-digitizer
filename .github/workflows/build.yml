name: Build desktop executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: PlotDigitizer-windows-x64.zip
          - os: macos-latest
            asset: PlotDigitizer-macos-arm64.zip
          - os: ubuntu-22.04
            asset: PlotDigitizer-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pyinstaller
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name PlotDigitizer --icon desktop/icon.ico desktop/plot_digitizer.py
          Compress-Archive -Path dist/PlotDigitizer.exe -DestinationPath ${{ matrix.asset }}
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name PlotDigitizer desktop/plot_digitizer.py
          cd dist && ditto -c -k --keepParent PlotDigitizer.app ../${{ matrix.asset }}
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --onefile --name PlotDigitizer desktop/plot_digitizer.py
          tar -czf ${{ matrix.asset }} -C dist PlotDigitizer
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          body: |
            **Windows**: `PlotDigitizer-windows-x64.zip` 압축 해제 → `PlotDigitizer.exe` 실행 (설치 불필요)
            **macOS**: `PlotDigitizer-macos-arm64.zip` 압축 해제 → `PlotDigitizer.app` (첫 실행 시 우클릭 › 열기)
            **Linux**: `tar xzf PlotDigitizer-linux-x64.tar.gz && ./PlotDigitizer`
            **Web**: https://niceysyu.github.io/plot-digitizer/
